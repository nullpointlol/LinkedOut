# Compuerta de calidad de LinkedOut (repo público: GitHub Actions sin límite de minutos).
# Corre en cada push y en cada pull request. Nada entra a develop ni a main sin los 4 checks en verde
# (suite, windows, navegador y cobertura: reglas de las ramas).
# La suite y el navegador corren en Linux; en Windows, solo los tests que tienen sentido ahí (marca `windows`:
# PowerShell, prioridades, Job Objects). La cobertura de los dos sistemas se combina y exige el piso
# (COBERTURA_MINIMA en tools/verificar.py).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  suite:
    name: suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LINKEDOUT_WORKERS: auto
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Chromium de Playwright (algunos tests sin navegador visible lo usan)
        run: python -m playwright install --with-deps chromium
      - name: Fuente con las métricas de Segoe UI (como en Windows)
        run: bash .github/fuentes-linux.sh
      - name: Suite
        run: python tools/verificar.py --etapa linux
      - name: Datos de cobertura
        run: mv .coverage .coverage.linux
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura-linux
          path: .coverage.linux
          include-hidden-files: true
          retention-days: 1

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Tests de Windows
        run: python tools/verificar.py --etapa windows
      - name: Datos de cobertura
        run: Rename-Item .coverage .coverage.windows
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura-windows
          path: .coverage.windows
          include-hidden-files: true
          retention-days: 1

  navegador:
    name: navegador
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Chromium de Playwright
        run: python -m playwright install --with-deps chromium
      - name: Fuente con las métricas de Segoe UI (como en Windows)
        run: bash .github/fuentes-linux.sh
      - name: Navegador y rendimiento
        run: python tools/verificar.py --etapa navegador

  cobertura:
    name: cobertura
    needs: [suite, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Coverage (la misma versión que trae pytest-cov)
        run: python -m pip install coverage==7.17.2
      - uses: actions/download-artifact@v8
        with:
          pattern: cobertura-*
          merge-multiple: true
      - name: Piso de cobertura (Linux + Windows)
        run: python tools/verificar.py --etapa cobertura
