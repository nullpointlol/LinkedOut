[pytest]
# Suite completa: python -m pytest -n auto
# Sin navegador: -m "not ui"   ·   Solo rendimiento: -m rendimiento
# Los que miden tiempos contra un tope se corren aparte y en serie (-m aislado): en paralelo la PC está cargada
# y la medida no dice nada. La compuerta corre -n auto -m "not aislado" y después -m aislado.
testpaths = tests
asyncio_default_fixture_loop_scope = function
timeout = 300
markers =
    aislado: mide tiempos contra un tope; se corre en serie, fuera del paralelo
